[project]
name = "sec-agent-workspace"
version = "0.0.0"
description = "uv workspace root for the Verified SEC Filings Research Agent."
requires-python = ">=3.12,<3.13"
dependencies = ["sec-agent"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pyright>=1.1.408",
    "pytest>=9.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sec-agent = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["sec_agent"]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/.venv", "web"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/sec-agent/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
