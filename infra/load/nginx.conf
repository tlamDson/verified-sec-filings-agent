# Round-robin over the API replicas. A replica that refuses a connection or does not
# accept one within 2 s is skipped for 10 s and the request goes to the next one. A POST
# already sent to a replica is never replayed, so a turn in flight on a killed replica
# fails and is counted as failed; the conversation continues on the next question.
events {
    worker_connections 4096;
}

http {
    upstream api {
        server api-1:8000 max_fails=1 fail_timeout=10s;
        server api-2:8000 max_fails=1 fail_timeout=10s;
        server api-3:8000 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            # Server-sent events reach the client as they are sent.
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
