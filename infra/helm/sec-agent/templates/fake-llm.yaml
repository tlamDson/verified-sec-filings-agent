{{- if .Values.fakeLlm.enabled }}
{{- range $name := .Values.fakeLlm.names }}
# Simulated OpenAI-compatible model (sec-agent chaos fake-llm): no provider, no key, no cost.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sec-agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    sec-agent/simulated: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sec-agent.selector" (dict "root" $ "component" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sec-agent.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        sec-agent/simulated: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: fake-llm
          image: {{ include "sec-agent.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sec-agent", "chaos", "fake-llm", "--host", "0.0.0.0", "--port", "8081"]
          ports:
            - name: http
              containerPort: 8081
          resources:
            {{- toYaml $.Values.fakeLlm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sec-agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    {{- include "sec-agent.selector" (dict "root" $ "component" $name) | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
---
{{- end }}
{{- end }}
