{{- if and .Values.api.enabled .Values.api.ingress.enabled }}
# Traefik ships with k3s; the k3d load balancer publishes it on 127.0.0.1 only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "sec-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - {{- with .Values.api.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  name: http
{{- end }}
