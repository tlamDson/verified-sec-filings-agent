# Deploys the API as a Docker Space on Hugging Face (free CPU, $0). The Space is a git repo:
# this job stages the files the image needs, sets the Space's secrets and variables, and
# pushes one commit. Hugging Face builds and runs the image.
#
# Repository settings:
#   secret   HF_TOKEN        write token of the Space owner (the only required secret)
#   variable HF_SPACE        owner/name of the Space, e.g. your-hf-user/sec-agent-api
#   secrets  DATABASE_URL, API_AUTH_SECRET, LLM_PROVIDERS, SEC_USER_AGENT   copied to the
#            Space when set; otherwise set them in the Space settings
#   variable FACTS_VERSION   facts index version to serve (default v1)
name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/sec-agent/**"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/hf-space/**"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Hugging Face
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          test -n "$HF_TOKEN" || { echo "::error::set the repository secret HF_TOKEN"; exit 1; }
          echo "$HF_SPACE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo "::error::set the repository variable HF_SPACE to owner/name"; exit 1; }

      - name: Stage the Space
        run: |
          mkdir -p space/packages
          cp infra/hf-space/Dockerfile infra/hf-space/README.md infra/hf-space/start.sh space/
          cp pyproject.toml uv.lock space/
          cp -r packages/sec-agent space/packages/sec-agent
          rm -rf space/packages/sec-agent/tests
          find space -name '__pycache__' -prune -exec rm -rf {} +

      - name: Create the Space if it does not exist
        run: |
          owner="${HF_SPACE%%/*}"
          name="${HF_SPACE#*/}"
          me="$(curl -fsS -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 | jq -r .name)"
          if [ "$owner" = "$me" ]; then
            body="$(jq -n --arg name "$name" '{type: "space", name: $name, sdk: "docker", private: false}')"
          else
            body="$(jq -n --arg name "$name" --arg org "$owner" '{type: "space", name: $name, organization: $org, sdk: "docker", private: false}')"
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
            -d "$body" https://huggingface.co/api/repos/create)"
          case "$status" in
            200|201) echo "created $HF_SPACE" ;;
            409) echo "$HF_SPACE exists" ;;
            *) echo "::error::creating the Space returned HTTP $status"; jq -r '.error // empty' response.json; exit 1 ;;
          esac

      - name: Set the Space secrets and variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_AUTH_SECRET: ${{ secrets.API_AUTH_SECRET }}
          LLM_PROVIDERS: ${{ secrets.LLM_PROVIDERS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FACTS_VERSION: ${{ vars.FACTS_VERSION }}
        run: |
          put() {
            # $1: endpoint, $2: name. A value that is not set is left as it is.
            value="$(printenv "$2" || true)"
            [ -n "$value" ] || { echo "skip $2 (not set here)"; return 0; }
            jq -n --arg key "$2" --arg value "$value" '{key: $key, value: $value}' \
              | curl -fsS -o /dev/null -X POST \
                  -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
                  --data-binary @- "$1"
            echo "set $2"
          }
          for name in DATABASE_URL API_AUTH_SECRET LLM_PROVIDERS SEC_USER_AGENT; do
            put "https://huggingface.co/api/spaces/$HF_SPACE/secrets" "$name"
          done
          put "https://huggingface.co/api/spaces/$HF_SPACE/variables" FACTS_VERSION

      - name: Push the Space
        working-directory: space
        run: |
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          # The Space holds only deploy snapshots, so each deploy replaces its history.
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "pushed ${GITHUB_SHA} to https://huggingface.co/spaces/${HF_SPACE}"
