[project]
name = "sec-agent"
version = "0.1.0"
description = "Research agent over public SEC filings where every number is traced to its source."
readme = "../../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "mcp>=1.20",
    "opentelemetry-api>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-sdk>=1.38",
    "psycopg[binary]>=3.3",
    "pydantic>=2.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Embedding model for `sec-agent index build|search` (GPU). Not needed by tests or CI.
embed = [
    "sentence-transformers>=5.1",
    "torch>=2.8",
]

[project.scripts]
sec-agent = "sec_agent.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
